[project]
name = "plantwatch"
version = "0.1.0"
description = "Near-real-time anomaly detection on industrial sensor streams, operated as an MLOps system on AWS."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "boto3>=1.34",
    "numpy>=1.26",
    "pandas>=2.1",
    "scikit-learn>=1.3",
]

[project.optional-dependencies]
deep = [
    "torch>=2.1",
]
dev = [
    "pytest>=8.0",
    "moto[s3]>=5.0",
    "ruff>=0.6",
    "pre-commit>=3.6",
]

[project.scripts]
plantwatch-replay = "plantwatch.ingest.replay:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
